# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Review the compute plans before applying: these are billable resources.
services:
  - type: web
    name: tracklab-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tracklab-rate-limits
          property: connectionString
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DEVELOPMENT_EPHEMERAL
        value: "false"
      - key: PRICING_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: keyvalue
    name: tracklab-rate-limits
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
